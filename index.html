<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Resout le theme avant le premier paint : choix memorise, sinon
      // preference systeme. Evite le flash d'un theme puis l'autre.
      (function () {
        try {
          var stocke = localStorage.getItem('alternance.theme');
          var theme =
            stocke === 'light' || stocke === 'dark'
              ? stocke
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (erreur) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta
      name="description"
      content="Recherchez et suivez les offres d'alternance : recherche, filtres, tri et fiches détaillées."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400..700&display=swap"
    />
    <title>Alternance, offres et suivi de candidatures</title>
  </head>
  <body>
    <a class="lien-evitement" href="#app">Aller au contenu</a>
    <div id="app"></div>
    <div id="chatbot"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
